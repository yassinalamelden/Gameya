[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.schemas.*", "app.ai.*", "app.ml.*"]
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["sandbox: hits the real PayPal sandbox (run manually / nightly)"]
