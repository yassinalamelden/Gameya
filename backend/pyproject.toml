[project]
name = "gameya-backend"
version = "0.1.0-mvp"
description = "Gam'eya - AI-run savings circles on PayPal (backend)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "TC"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["app/schemas", "app/ai", "app/ml"]
explicit_package_bases = false
disallow_untyped_defs = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pydantic.*"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
