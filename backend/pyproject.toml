[project]
name = "gameya-backend"
version = "0.1.0-mvp"
description = "Gam'eya - AI-run savings circles on PayPal (backend)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/schemas/contracts.py" = ["TRY004"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["app/schemas", "app/leash"]
explicit_package_bases = false
disallow_untyped_defs = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pydantic.*"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["app.ai.*", "app.ml.*", "scipy.*", "ulid.*"]
strict = false
ignore_errors = true

[[tool.mypy.overrides]]
module = ["app.ai._llm_port", "app.ai.prose_guard"]
strict = false
follow_imports = "skip"
follow_imports_for_stubs = true
