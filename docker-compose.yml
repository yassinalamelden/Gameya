services:
  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      - ENV=local_test
    ports:
      - "8000:8000"
    volumes:
      - gameya-db:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_USE_MOCKS=${DEMO_MODE:-0}
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  gameya-db:
