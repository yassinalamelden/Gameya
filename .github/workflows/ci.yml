name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets scan (gitleaks, full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Lint backend (ruff)
        run: ruff check app tests
        working-directory: backend

      - name: Type-check backend (mypy strict on schemas/ai/ml)
        run: mypy
        working-directory: backend

      - name: Test backend (pytest incl. integration)
        run: pytest
        working-directory: backend

      - name: Frontend toolchain guard
        id: fe
        run: |
          if [ -s package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend/package.json not filled in yet (P4 lane); skipped"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: frontend

      - name: Node 20
        if: steps.fe.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        if: steps.fe.outputs.present == 'true'
        run: npm ci
        working-directory: frontend

      - name: Type-check frontend (tsc --noEmit, no `any` in contracts.ts/client.ts)
        if: steps.fe.outputs.present == 'true'
        run: npx tsc --noEmit
        working-directory: frontend
