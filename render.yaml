services:
  - type: web
    name: gameya-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gameya-db
          property: connectionString
  - type: web
    name: gameya-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_USE_MOCKS
        value: "false"
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: gameya-db
